version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    rebase-strategy: auto
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: monthly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '04:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    rebase-strategy: auto
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

